[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aliquot-research"
version = "0.2.0"
description = "Exact aliquot arithmetic and independently checked bounded experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aliquot = "aliquot.__main__:main"

[tool.setuptools.packages.find]
include = ["aliquot*"]
